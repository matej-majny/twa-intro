<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-group input:focus ~ label,
        .input-group input:not(:placeholder-shown) ~ label {
            transform: translateY(-1.25rem) scale(0.85);
            color: #818cf8;
        }

        .toast-enter {
            transform: translateY(-100%);
            opacity: 0;
        }
        .toast-show {
            transform: translateY(0);
            opacity: 1;
        }

        /* Password strength bar animations */
        .strength-bar {
            transition: width 0.3s ease, background-color 0.3s ease;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 sm:p-6 md:p-8 min-h-screen relative overflow-x-hidden">

    <!-- Ambient Glowing Background Circles -->
    <div class="absolute top-1/4 left-1/4 w-72 h-72 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-purple-500/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 flex items-center space-x-3 px-6 py-3.5 rounded-xl text-white shadow-2xl glass-card transition-all duration-300 pointer-events-none toast-enter">
        <div id="toast-icon" class="w-6 h-6 flex items-center justify-center rounded-full bg-emerald-500/20 text-emerald-400">
            <i class="fas fa-check text-xs"></i>
        </div>
        <span id="toast-message" class="text-sm font-medium">Account created successfully!</span>
    </div>

    <!-- Main Signup Card Container -->
    <div class="w-full max-w-md glass-card rounded-2xl shadow-2xl p-6 sm:p-8 relative z-10 my-auto">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-600/20 text-indigo-400 mb-3 border border-indigo-500/30">
                <i class="fas fa-user-plus text-xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-tight">Create an Account</h1>
            <p class="text-slate-400 text-sm mt-1">Join thousands of users today</p>
        </div>

        <!-- Signup Form -->
        <form id="signup-form" class="space-y-5" novalidate>
            
            <!-- Full Name Field -->
            <div class="space-y-1">
                <label for="fullname" class="block text-xs font-medium text-slate-300">Full Name</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i class="fas fa-user text-sm"></i>
                    </div>
                    <input type="text" id="fullname" name="fullname" placeholder="John Doe" 
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-800/60 border border-slate-700/80 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors">
                </div>
                <p id="name-error" class="text-xs text-rose-400 hidden pl-1 mt-1"></p>
            </div>

            <!-- Email Field -->
            <div class="space-y-1">
                <label for="email" class="block text-xs font-medium text-slate-300">Email Address</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i class="fas fa-envelope text-sm"></i>
                    </div>
                    <input type="email" id="email" name="email" placeholder="name@example.com" 
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-800/60 border border-slate-700/80 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors">
                </div>
                <p id="email-error" class="text-xs text-rose-400 hidden pl-1 mt-1"></p>
            </div>

            <!-- Password Field -->
            <div class="space-y-1">
                <label for="password" class="block text-xs font-medium text-slate-300">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i class="fas fa-lock text-sm"></i>
                    </div>
                    <input type="password" id="password" name="password" placeholder="••••••••" 
                        class="w-full pl-10 pr-10 py-2.5 bg-slate-800/60 border border-slate-700/80 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors">
                    <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-200 transition-colors focus:outline-none" aria-label="Toggle password visibility">
                        <i class="fas fa-eye text-sm"></i>
                    </button>
                </div>
                <!-- Password Strength Bar -->
                <div class="mt-2">
                    <div class="h-1.5 w-full bg-slate-700/50 rounded-full overflow-hidden">
                        <div id="strength-bar" class="strength-bar h-full w-0 bg-rose-500"></div>
                    </div>
                    <div class="flex justify-between items-center mt-1">
                        <p id="strength-text" class="text-[11px] text-slate-400">Strength: <span class="font-medium">Enter password</span></p>
                    </div>
                </div>
                <p id="password-error" class="text-xs text-rose-400 hidden pl-1 mt-1"></p>
            </div>

            <!-- Confirm Password Field -->
            <div class="space-y-1">
                <label for="confirm-password" class="block text-xs font-medium text-slate-300">Confirm Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i class="fas fa-shield-alt text-sm"></i>
                    </div>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="••••••••" 
                        class="w-full pl-10 pr-10 py-2.5 bg-slate-800/60 border border-slate-700/80 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors">
                    <button type="button" id="toggle-confirm-password" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-200 transition-colors focus:outline-none" aria-label="Toggle confirm password visibility">
                        <i class="fas fa-eye text-sm"></i>
                    </button>
                </div>
                <p id="confirm-error" class="text-xs text-rose-400 hidden pl-1 mt-1"></p>
            </div>

            <!-- Terms and Conditions Checkbox -->
            <div class="flex items-start pt-1">
                <div class="flex items-center h-5">
                    <input id="terms" type="checkbox" class="w-4 h-4 text-indigo-600 bg-slate-800 border-slate-700 rounded focus:ring-indigo-500 focus:ring-offset-slate-900 focus:ring-2">
                </div>
                <label for="terms" class="ml-2.5 text-xs text-slate-400">
                    I agree to the <a href="#" class="text-indigo-400 hover:underline">Terms of Service</a> and <a href="#" class="text-indigo-400 hover:underline">Privacy Policy</a>
                </label>
            </div>
            <p id="terms-error" class="text-xs text-rose-400 hidden pl-1"></p>

            <!-- Submit Button -->
            <button type="submit" id="submit-btn" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-medium text-sm rounded-xl transition duration-200 shadow-lg shadow-indigo-600/30 flex items-center justify-center space-x-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-slate-900">
                <span>Create Account</span>
                <i class="fas fa-arrow-right text-xs"></i>
            </button>
        </form>

        <!-- Footer / Login link -->
        <p class="text-center text-xs text-slate-400 mt-6">
            Already have an account? 
            <a href="signin.html" class="text-indigo-400 font-medium hover:underline hover:text-indigo-300">Sign in</a>
        </p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM Elements
            const form = document.getElementById('signup-form');
            const fullnameInput = document.getElementById('fullname');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirm-password');
            const termsCheckbox = document.getElementById('terms');

            const togglePasswordBtn = document.getElementById('toggle-password');
            const toggleConfirmPasswordBtn = document.getElementById('toggle-confirm-password');

            const strengthBar = document.getElementById('strength-bar');
            const strengthText = document.getElementById('strength-text');

            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');

            // --- Toggle Password Visibility ---
            function setupPasswordToggle(button, input) {
                button.addEventListener('click', () => {
                    const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                    input.setAttribute('type', type);
                    
                    const icon = button.querySelector('i');
                    if (type === 'text') {
                        icon.classList.remove('fa-eye');
                        icon.classList.add('fa-eye-slash');
                    } else {
                        icon.classList.remove('fa-eye-slash');
                        icon.classList.add('fa-eye');
                    }
                });
            }

            setupPasswordToggle(togglePasswordBtn, passwordInput);
            setupPasswordToggle(toggleConfirmPasswordBtn, confirmPasswordInput);

            // --- Password Strength Evaluator ---
            passwordInput.addEventListener('input', () => {
                const val = passwordInput.value;
                let score = 0;

                if (!val) {
                    strengthBar.style.width = '0%';
                    strengthText.innerHTML = 'Strength: <span class="font-medium">Enter password</span>';
                    return;
                }

                // Criteria checking
                if (val.length >= 8) score++;
                if (/[A-Z]/.test(val)) score++;
                if (/[0-9]/.test(val)) score++;
                if (/[^A-Za-z0-9]/.test(val)) score++;

                // Visual Feedback
                switch (score) {
                    case 1:
                        strengthBar.style.width = '25%';
                        strengthBar.className = 'strength-bar h-full bg-rose-500';
                        strengthText.innerHTML = 'Strength: <span class="font-semibold text-rose-400">Weak</span>';
                        break;
                    case 2:
                        strengthBar.style.width = '50%';
                        strengthBar.className = 'strength-bar h-full bg-amber-500';
                        strengthText.innerHTML = 'Strength: <span class="font-semibold text-amber-400">Fair</span>';
                        break;
                    case 3:
                        strengthBar.style.width = '75%';
                        strengthBar.className = 'strength-bar h-full bg-blue-500';
                        strengthText.innerHTML = 'Strength: <span class="font-semibold text-blue-400">Good</span>';
                        break;
                    case 4:
                        strengthBar.style.width = '100%';
                        strengthBar.className = 'strength-bar h-full bg-emerald-500';
                        strengthText.innerHTML = 'Strength: <span class="font-semibold text-emerald-400">Strong</span>';
                        break;
                }
            });

            // --- Error Display Helpers ---
            function showError(elementId, message) {
                const errorEl = document.getElementById(elementId);
                errorEl.textContent = message;
                errorEl.classList.remove('hidden');
            }

            function clearError(elementId) {
                const errorEl = document.getElementById(elementId);
                errorEl.textContent = '';
                errorEl.classList.add('hidden');
            }

            function clearAllErrors() {
                ['name-error', 'email-error', 'password-error', 'confirm-error', 'terms-error'].forEach(clearError);
            }

            // --- Email Regex Check ---
            function isValidEmail(email) {
                return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            }

            // --- Toast Notification ---
            function showToast(message, isSuccess = true) {
                toastMessage.textContent = message;
                if (isSuccess) {
                    toastIcon.className = "w-6 h-6 flex items-center justify-center rounded-full bg-emerald-500/20 text-emerald-400";
                    toastIcon.innerHTML = '<i class="fas fa-check text-xs"></i>';
                } else {
                    toastIcon.className = "w-6 h-6 flex items-center justify-center rounded-full bg-rose-500/20 text-rose-400";
                    toastIcon.innerHTML = '<i class="fas fa-exclamation text-xs"></i>';
                }

                toast.classList.remove('toast-enter');
                toast.classList.add('toast-show');

                setTimeout(() => {
                    toast.classList.remove('toast-show');
                    toast.classList.add('toast-enter');
                }, 3500);
            }

            // --- Form Submit Handler ---
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                clearAllErrors();

                let isValid = true;

                // Name validation
                if (!fullnameInput.value.trim()) {
                    showError('name-error', 'Please enter your full name');
                    isValid = false;
                }

                // Email validation
                if (!emailInput.value.trim()) {
                    showError('email-error', 'Please enter your email address');
                    isValid = false;
                } else if (!isValidEmail(emailInput.value.trim())) {
                    showError('email-error', 'Please enter a valid email address');
                    isValid = false;
                }

                // Password validation
                if (!passwordInput.value) {
                    showError('password-error', 'Please enter a password');
                    isValid = false;
                } else if (passwordInput.value.length < 8) {
                    showError('password-error', 'Password must be at least 8 characters');
                    isValid = false;
                }

                // Confirm Password validation
                if (!confirmPasswordInput.value) {
                    showError('confirm-error', 'Please confirm your password');
                    isValid = false;
                } else if (passwordInput.value !== confirmPasswordInput.value) {
                    showError('confirm-error', 'Passwords do not match');
                    isValid = false;
                }

                // Terms checkbox validation
                if (!termsCheckbox.checked) {
                    showError('terms-error', 'You must agree to the Terms and Privacy Policy');
                    isValid = false;
                }

                if (isValid) {
                    // Success action
                    showToast('Account created successfully! Welcome aboard.');
                    form.reset();
                    strengthBar.style.width = '0%';
                    strengthText.innerHTML = 'Strength: <span class="font-medium">Enter password</span>';
                } else {
                    showToast('Please fix the errors in the form.', false);
                }
            });
        });
    </script>
</body>
</html>
